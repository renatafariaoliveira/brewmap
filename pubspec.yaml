name: brewmap
description: "Discover craft breweries worldwide with an interactive map, filters, and favorites."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter
  copy_with_extension: ^15.0.1
  dio: ^5.9.2
  flutter_bloc: ^9.1.1
  flutter_map: ^8.3.0
  get_it: ^9.2.1
  google_fonts: ^8.1.0
  hive_flutter: ^1.1.0
  latlong2: ^0.9.1
  logger: ^2.7.0
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  gherkart: ^0.1.0
  build_runner: ^2.15.0
  copy_with_extension_gen: 15.0.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/images/brewmap.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/brewmap.png
    background_color: "#000000"
    theme_color: "#000000"


flutter:
  uses-material-design: true
  assets:
    - google_fonts/
    - features/bdd/favorites.feature
    - features/bdd/search.feature